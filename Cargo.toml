[workspace]
resolver = "2"
members = [
    "crates/blongo-protocol",
    "crates/blongo-harness",
    "crates/blongo-store",
    "crates/blongo-core",
    "apps/blongo",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
blongo-protocol = { path = "crates/blongo-protocol" }
blongo-harness = { path = "crates/blongo-harness" }
blongo-store = { path = "crates/blongo-store" }
blongo-core = { path = "crates/blongo-core" }

# GPUI: Zed's Apache-2.0 UI crates only, pinned to one rev.
# Never depend on Zed's GPL-3.0 crates (editor, terminal, markdown, ui, ...).
# See docs/phase0/gpui-choice.md for why this rev and not the zui fork.
gpui = { git = "https://github.com/zed-industries/zed", rev = "badfb8d31f2a03d0e3d996897bb93779003f4607", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "badfb8d31f2a03d0e3d996897bb93779003f4607" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "sync", "time"] }
mimalloc = { version = "0.1", default-features = false }
uuid = { version = "1", features = ["v7", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
unicode-segmentation = "1"

[profile.release]
# Fat LTO + one codegen unit: ~6 MB smaller binary and ~4 MiB less resident
# code than thin LTO (docs/phase1/report.md), at the cost of slower release
# builds.
lto = "fat"
strip = "symbols"
codegen-units = 1

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
# gpui is unusably slow unoptimized
opt-level = 2
